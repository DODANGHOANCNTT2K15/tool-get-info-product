<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Video Research</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #182230;
      --muted: #667085;
      --line: #d6dde5;
      --brand: #0f766e;
      --brand-dark: #115e59;
      --accent: #2563eb;
      --danger: #b42318;
      --warn: #a15c07;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input, select { font: inherit; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .topbar {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 16px 20px;
      display: grid;
      gap: 12px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }

    .search-form {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) 112px;
      gap: 10px;
      max-width: 760px;
    }

    .search-input,
    .filter {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }

    .search-input:focus,
    .filter:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }

    .primary-button,
    .open-link,
    .copy-button,
    .tab-button {
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .primary-button {
      border: 0;
      background: var(--brand);
      color: #fff;
    }

    .primary-button:hover { background: var(--brand-dark); }
    .primary-button:disabled { cursor: not-allowed; opacity: 0.65; }

    .status-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 0 9px;
      background: #e6f4f1;
      color: var(--brand-dark);
      font-weight: 700;
    }

    .pill.error { background: #fee4e2; color: var(--danger); }
    .pill.running { background: #e0ecff; color: var(--accent); }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
    }

    .sidebar {
      min-height: 0;
      border-right: 1px solid var(--line);
      background: #eef2f5;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .sidebar-controls {
      padding: 12px;
      display: grid;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      background: #f8fafb;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .tab-button {
      height: 38px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
    }

    .tab-button.active {
      border-color: var(--brand);
      color: var(--brand-dark);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .list-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .video-list {
      overflow-y: auto;
      overflow-x: hidden;
      max-height: calc(100vh - 300px);
      padding: 12px;
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .video-item {
      width: 100%;
      display: grid;
      gap: 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
    }

    .video-item:hover { border-color: #b7c7d8; }
    .video-item.active {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .video-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .video-title {
      min-width: 0;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .badge {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 3px 8px;
      background: #e0f2f1;
      color: var(--brand-dark);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge.error { background: #fee4e2; color: var(--danger); }
    .badge.pending { background: #fff4d6; color: var(--warn); }

    .snippet {
      display: -webkit-box;
      min-height: 38px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      overflow: hidden;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .current-title { min-width: 0; }
    .current-title h2 {
      margin: 0 0 4px;
      font-size: 22px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .open-link {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      border: 0;
      background: var(--brand);
      color: #fff;
      padding: 0 14px;
      text-decoration: none;
    }

    .open-link:hover { background: var(--brand-dark); }

    .content {
      min-height: 0;
      overflow: auto;
      padding: 22px;
      display: grid;
      grid-template-columns: minmax(320px, 520px) minmax(0, 1fr);
      gap: 22px;
      align-content: start;
    }

    .media-panel,
    .transcript-panel {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: calc(100vh - 230px);
      min-height: 430px;
      border: 0;
      display: block;
      background: #111827;
      border-radius: 8px 8px 0 0;
      object-fit: cover;
    }

    #videoFrame[hidden],
    #localVideoPlayer[hidden] {
      display: none !important;
    }

    /* Hide iframe when showing douyin videos */
    .platform-douyin #videoFrame {
      display: none !important;
    }

    /* Hide video player when showing facebook videos */
    .platform-facebook #localVideoPlayer {
      display: none !important;
    }

    .fallback {
      padding: 14px;
      color: var(--muted);
      font-size: 14px;
      border-top: 1px solid var(--line);
    }

    audio {
      width: 100%;
      display: block;
      border-top: 1px solid var(--line);
      padding: 12px;
    }

    .panel-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-head h3 {
      margin: 0;
      font-size: 17px;
    }

    .copy-button {
      height: 36px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 0 12px;
    }

    .copy-button:hover {
      border-color: var(--brand);
      color: var(--brand-dark);
    }

    .transcript {
      margin: 0;
      padding: 18px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
      font-size: 16px;
    }

    .empty-state {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    mark {
      background: #fef08a;
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }

    @media (max-width: 980px) {
      .workspace { grid-template-columns: 1fr; }
      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .video-list {
        grid-auto-flow: column;
        grid-auto-columns: minmax(260px, 1fr);
        overflow-x: auto;
      }
      .content { grid-template-columns: 1fr; }
      .video-frame, .cover-image { min-height: 520px; }
    }

    @media (max-width: 640px) {
      .topline,
      .viewer-header {
        align-items: stretch;
        flex-direction: column;
      }
      .search-form { grid-template-columns: 1fr; }
      .viewer-header,
      .content { padding: 14px; }
      .video-frame, .cover-image { min-height: 430px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topline">
        <h1>Product video research</h1>
        <form id="searchForm" class="search-form">
          <input id="keywordInput" class="search-input" type="search" placeholder="Nhập từ khóa sản phẩm" autocomplete="off">
          <button id="runButton" class="primary-button" type="submit">Tìm</button>
        </form>
      </div>
      <div class="status-line">
        <span id="jobPill" class="pill">Sẵn sàng</span>
        <span id="jobMessage">Nhập từ khóa để chạy workflow.</span>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-controls">
          <div class="tabs">
            <button id="facebookTab" class="tab-button active" type="button" data-platform="facebook">Facebook</button>
            <button id="douyinTab" class="tab-button" type="button" data-platform="douyin">Douyin</button>
          </div>
          <input id="filterInput" class="filter" type="search" placeholder="Tìm trong transcript">
          <select id="statusFilter" class="filter" aria-label="Lọc trạng thái">
            <option value="all">Tất cả</option>
            <option value="done">Đã xử lý</option>
            <option value="error">Lỗi</option>
            <option value="hasText">Có text</option>
          </select>
          <div id="listMeta" class="list-meta">Đang tải dữ liệu...</div>
          <div id="uploadContainer" style="margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line);">
            <label style="font-size: 11px; font-weight: bold; color: var(--muted); display: block; margin-bottom: 4px; text-transform: uppercase;">Nhập HTML kết quả tìm kiếm:</label>
            <div style="display: flex; gap: 6px;">
              <input type="file" id="htmlFileInput" accept=".html,.txt" style="display: none;">
              <button id="uploadFileButton" type="button" class="tab-button" style="font-size: 12px; height: 32px; flex: 1;">Chọn File HTML</button>
              <button id="pasteTextButton" type="button" class="tab-button" style="font-size: 12px; height: 32px; flex: 1;">Dán HTML</button>
            </div>
            <div id="pasteAreaContainer" style="display: none; margin-top: 8px;">
              <textarea id="htmlPasteArea" placeholder="Nhấp chuột phải -> Inspect -> Copy -> Copy outerHTML thẻ kết quả hoặc dán nguồn trang vào đây..." style="width: 100%; height: 80px; font-size: 12px; font-family: monospace; border: 1px solid var(--line); border-radius: 6px; padding: 6px; resize: vertical; outline: none;"></textarea>
              <button id="submitPasteButton" type="button" class="primary-button" style="font-size: 12px; height: 28px; width: 100%; margin-top: 4px;">Xử lý HTML</button>
            </div>
          </div>
        </div>
        <div id="videoList" class="video-list"></div>
      </aside>

      <main class="main">
        <header class="viewer-header">
          <div class="current-title">
            <h2 id="currentTitle">Chọn một video</h2>
            <div id="currentMeta" class="meta"></div>
          </div>
          <a id="openLink" class="open-link" href="#" target="_blank" rel="noreferrer">Mở video</a>
        </header>

        <section class="content">
          <div class="media-panel">
            <iframe id="videoFrame" class="video-frame" title="Video" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe>
            <video id="localVideoPlayer" class="video-frame" controls hidden></video>
            <div id="fallback" class="fallback"></div>
          </div>

          <article class="transcript-panel">
            <div class="panel-head">
              <h3>Transcript</h3>
              <button id="copyButton" class="copy-button" type="button">Copy text</button>
            </div>
            <p id="transcript" class="transcript">Chưa có transcript để hiển thị.</p>
          </article>
        </section>
      </main>
    </div>
  </div>

  <script>
    const state = {
      platform: "facebook",
      videos: { facebook: [], douyin: [] },
      filtered: [],
      selected: { facebook: null, douyin: null },
      filter: "",
      status: "all",
      wasRunning: false,
      loadedVideoUrl: { facebook: null, douyin: null }
    };

    const el = {
      searchForm: document.getElementById("searchForm"),
      keywordInput: document.getElementById("keywordInput"),
      runButton: document.getElementById("runButton"),
      jobPill: document.getElementById("jobPill"),
      jobMessage: document.getElementById("jobMessage"),
      facebookTab: document.getElementById("facebookTab"),
      douyinTab: document.getElementById("douyinTab"),
      filterInput: document.getElementById("filterInput"),
      statusFilter: document.getElementById("statusFilter"),
      listMeta: document.getElementById("listMeta"),
      videoList: document.getElementById("videoList"),
      currentTitle: document.getElementById("currentTitle"),
      currentMeta: document.getElementById("currentMeta"),
      openLink: document.getElementById("openLink"),
      videoFrame: document.getElementById("videoFrame"),
      localVideoPlayer: document.getElementById("localVideoPlayer"),
      fallback: document.getElementById("fallback"),
      transcript: document.getElementById("transcript"),
      copyButton: document.getElementById("copyButton"),
      htmlFileInput: document.getElementById("htmlFileInput"),
      uploadFileButton: document.getElementById("uploadFileButton"),
      pasteTextButton: document.getElementById("pasteTextButton"),
      pasteAreaContainer: document.getElementById("pasteAreaContainer"),
      htmlPasteArea: document.getElementById("htmlPasteArea"),
      submitPasteButton: document.getElementById("submitPasteButton")
    };

    init();

    function init() {
      bindEvents();
      refreshData();
      window.setInterval(refreshData, 2500);
    }

    function bindEvents() {
      el.searchForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const keyword = el.keywordInput.value.trim();
        if (!keyword) return;

        el.runButton.disabled = true;
        const response = await fetch("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ keyword })
        });
        const payload = await response.json();
        if (!response.ok) {
          alert(payload.error || "Không chạy được workflow.");
        }
        await refreshData();
      });

      [el.facebookTab, el.douyinTab].forEach((button) => {
        button.addEventListener("click", () => {
          state.platform = button.dataset.platform;
          renderTabs();
          applyFilters();
        });
      });

      el.filterInput.addEventListener("input", () => {
        state.filter = el.filterInput.value.trim();
        applyFilters();
      });

      el.statusFilter.addEventListener("change", () => {
        state.status = el.statusFilter.value;
        applyFilters();
      });

      el.copyButton.addEventListener("click", async () => {
        const selected = getSelectedVideo();
        if (!selected || !selected.displayText) return;
        await navigator.clipboard.writeText(selected.displayText);
        el.copyButton.textContent = "Đã copy";
        window.setTimeout(() => { el.copyButton.textContent = "Copy text"; }, 1200);
      });

      el.uploadFileButton.addEventListener("click", () => {
        el.htmlFileInput.click();
      });

      el.htmlFileInput.addEventListener("change", async () => {
        const file = el.htmlFileInput.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
          const htmlContent = e.target.result;
          await uploadHtml(htmlContent);
        };
        reader.readAsText(file, "utf-8");
        el.htmlFileInput.value = "";
      });

      el.pasteTextButton.addEventListener("click", () => {
        const isHidden = el.pasteAreaContainer.style.display === "none";
        el.pasteAreaContainer.style.display = isHidden ? "block" : "none";
        el.pasteTextButton.textContent = isHidden ? "Đóng Khung" : "Dán HTML";
      });

      el.submitPasteButton.addEventListener("click", async () => {
        const htmlContent = el.htmlPasteArea.value.trim();
        if (!htmlContent) {
          alert("Vui lòng dán nội dung HTML trước.");
          return;
        }
        await uploadHtml(htmlContent);
        el.htmlPasteArea.value = "";
        el.pasteAreaContainer.style.display = "none";
        el.pasteTextButton.textContent = "Dán HTML";
      });
    }

    async function uploadHtml(htmlContent) {
      const platform = state.platform;
      el.uploadFileButton.disabled = true;
      el.submitPasteButton.disabled = true;
      el.jobPill.textContent = "Đang xử lý";
      el.jobPill.className = "pill running";
      el.jobMessage.textContent = `Đang trích xuất link từ HTML cho ${platform}...`;

      try {
        const response = await fetch("/api/upload-html", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ platform, html: htmlContent })
        });
        const payload = await response.json();
        if (response.ok) {
          alert(`Thành công! Đã trích xuất ${payload.total_links} link và bắt đầu xử lý trong nền.`);
        } else {
          alert(payload.error || "Có lỗi xảy ra khi xử lý HTML.");
        }
      } catch (error) {
        alert(`Lỗi kết nối: ${error.message}`);
      } finally {
        el.uploadFileButton.disabled = false;
        el.submitPasteButton.disabled = false;
        await refreshData();
      }
    }

    async function refreshData() {
      try {
        const response = await fetch("/api/data", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        state.videos.facebook = normalizeVideos(data.facebook.results || [], "facebook");
        state.videos.douyin = normalizeVideos(data.douyin.results || [], "douyin");
        updateJobStatus(data.status || {});
        renderTabs();
        applyFilters();
      } catch (error) {
        el.jobPill.textContent = "Lỗi";
        el.jobPill.className = "pill error";
        el.jobMessage.textContent = `Không tải được dữ liệu: ${error.message}`;
      }
    }

    function updateJobStatus(status) {
      const running = Boolean(status.running);
      el.runButton.disabled = running;
      el.jobPill.className = `pill ${status.status === "error" ? "error" : running ? "running" : ""}`;
      el.jobPill.textContent = status.status === "completed" ? "Hoàn thành" : status.status === "error" ? "Lỗi" : running ? "Đang chạy" : "Sẵn sàng";
      el.jobMessage.textContent = status.message || "Sẵn sàng.";

      if (state.wasRunning && status.status === "completed") {
        alert("Hoàn thành toàn bộ workflow.");
      }
      if (state.wasRunning && status.status === "error") {
        alert(`Workflow bị lỗi: ${status.error || status.message}`);
      }
      state.wasRunning = running;
    }

    function normalizeVideos(videos, platform) {
      return videos.map((video, index) => {
        const text = fixText(video.text || "");
        const translated = fixText(video.text_vi || "");
        const title = fixText(video.title || "");
        const displayText = translated || text || fixText(video.error || "");
        const label = platform === "douyin" ? (title || video.id || `Video ${index + 1}`) : (video.id || `Video ${index + 1}`);
        return {
          ...video,
          platform,
          id: String(video.id || video.index || index + 1),
          index: video.index || index + 1,
          title,
          displayText,
          rawText: text,
          translatedText: translated,
          searchText: `${video.id || ""} ${video.type || ""} ${title} ${text} ${translated}`.toLowerCase()
        };
      });
    }

    function renderTabs() {
      el.facebookTab.classList.toggle("active", state.platform === "facebook");
      el.douyinTab.classList.toggle("active", state.platform === "douyin");
      el.facebookTab.textContent = `Facebook (${state.videos.facebook.length})`;
      el.douyinTab.textContent = `Douyin (${state.videos.douyin.length})`;
      
      // Update platform class on media panel
      const mediaPanel = document.querySelector(".media-panel");
      if (mediaPanel) {
        mediaPanel.classList.remove("platform-facebook", "platform-douyin");
        mediaPanel.classList.add(`platform-${state.platform}`);
      }
    }

    function applyFilters() {
      const query = state.filter.toLowerCase();
      const videos = state.videos[state.platform] || [];
      state.filtered = videos.filter((video) => {
        const statusMatches =
          state.status === "all" ||
          video.status === state.status ||
          (state.status === "hasText" && Boolean(video.displayText.trim()));
        return statusMatches && (!query || video.searchText.includes(query));
      });

      if (!state.filtered.some((video) => video.id === state.selected[state.platform])) {
        state.selected[state.platform] = state.filtered[0]?.id || null;
      }

      renderList();
      renderSelected();
    }

    function renderList() {
      const videos = state.videos[state.platform] || [];
      el.listMeta.textContent = `${state.filtered.length}/${videos.length} video`;

      if (!state.filtered.length) {
        el.videoList.innerHTML = '<div class="empty-state">Không có video phù hợp.</div>';
        return;
      }

      el.videoList.innerHTML = state.filtered.map((video) => {
        const active = video.id === state.selected[state.platform] ? " active" : "";
        const badgeClass = video.status === "error" ? "badge error" : video.status === "done" ? "badge" : "badge pending";
        const title = state.platform === "douyin" ? (video.title || video.id) : video.id;
        const snippet = video.displayText || "Chưa có transcript.";
        return `
          <button class="video-item${active}" type="button" data-id="${escapeHtml(video.id)}">
            <span class="video-topline">
              <span class="video-title">#${video.index} - ${escapeHtml(title)}</span>
              <span class="${badgeClass}">${escapeHtml(video.status || "pending")}</span>
            </span>
            <span class="snippet">${highlight(snippet, state.filter)}</span>
          </button>
        `;
      }).join("");

      el.videoList.querySelectorAll(".video-item").forEach((item) => {
        item.addEventListener("click", () => {
          state.selected[state.platform] = item.dataset.id;
          renderList();
          renderSelected();
        });
      });
    }

    function renderSelected() {
      const selected = getSelectedVideo();
      if (!selected) {
        el.currentTitle.textContent = "Chọn một video";
        el.currentMeta.textContent = "";
        el.openLink.href = "#";
        el.videoFrame.removeAttribute("src");
        el.videoFrame.hidden = true;
        el.videoFrame.style.display = "none";
        el.localVideoPlayer.removeAttribute("src");
        el.localVideoPlayer.hidden = true;
        el.localVideoPlayer.style.display = "none";
        state.loadedVideoUrl.facebook = null;
        state.loadedVideoUrl.douyin = null;
        el.transcript.textContent = "Chưa có transcript để hiển thị.";
        el.fallback.textContent = "Dữ liệu sẽ xuất hiện sau khi workflow chạy xong.";
        return;
      }

      el.currentTitle.textContent = `#${selected.index} - ${selected.platform === "douyin" ? (selected.title || selected.id) : selected.id}`;
      el.currentMeta.textContent = `${selected.platform} | ${selected.status || "unknown"} | ${selected.url || ""}`;
      el.openLink.href = selected.url || "#";

      if (selected.platform === "facebook") {
        el.localVideoPlayer.hidden = true;
        el.localVideoPlayer.removeAttribute("src");
        el.localVideoPlayer.style.display = "none";
        el.videoFrame.hidden = false;
        el.videoFrame.style.display = "block";
        state.loadedVideoUrl.douyin = null;
        // Only update src if it has changed, preventing continuous iframe reload
        if (state.loadedVideoUrl.facebook !== selected.url) {
          el.videoFrame.src = buildFacebookEmbedUrl(selected.url);
          state.loadedVideoUrl.facebook = selected.url;
        }
        el.fallback.textContent = "Nếu Facebook không cho nhúng video, dùng nút Mở video.";
      } else {
        // Douyin platform
        el.videoFrame.hidden = true;
        el.videoFrame.removeAttribute("src");
        el.videoFrame.style.display = "none";
        state.loadedVideoUrl.facebook = null;

        const mediaPath = selected.media_path;
        if (mediaPath) {
          el.localVideoPlayer.hidden = false;
          el.localVideoPlayer.style.display = "block";
          const targetVideoSrc = encodeFileUrl(String(mediaPath));
          if (state.loadedVideoUrl.douyin !== selected.url) {
            const cacheBusted = targetVideoSrc + (targetVideoSrc.includes('?') ? '&' : '?') + 'v=' + Date.now();
            el.localVideoPlayer.src = cacheBusted;
            state.loadedVideoUrl.douyin = selected.url;
          }
          el.fallback.textContent = `Đang phát video Douyin từ file local: ${mediaPath}`;
        } else {
          el.localVideoPlayer.hidden = true;
          el.localVideoPlayer.removeAttribute("src");
          el.localVideoPlayer.style.display = "none";
          state.loadedVideoUrl.douyin = null;
          el.fallback.textContent = "Video Douyin chưa được tải về máy. Hãy chạy quy trình để tải.";
        }
      }

      el.transcript.innerHTML = highlight(selected.displayText || "Video này chưa có transcript.", state.filter);
    }

    function getSelectedVideo() {
      return (state.videos[state.platform] || []).find((video) => video.id === state.selected[state.platform]);
    }

    function buildFacebookEmbedUrl(url) {
      if (!url) return "";
      let embedUrl = url;
      // Convert Reel URL to watch URL format for better Facebook iframe embed compatibility
      const reelMatch = url.match(/\/reel\/([^/?#]+)/);
      if (reelMatch) {
        embedUrl = `https://www.facebook.com/watch/?v=${reelMatch[1]}`;
      }
      const params = new URLSearchParams({ href: embedUrl, show_text: "false", width: "560" });
      return `https://www.facebook.com/plugins/video.php?${params.toString()}`;
    }
    function encodeFileUrl(path) {
      if (!path) return path;
      let p = String(path).replaceAll('\\', '/');
      // If absolute Windows path was provided (C:/...), strip to workspace-relative
      const candidates = ['douyin_downloads/', 'downloads/'];
      let idx = -1;
      for (const c of candidates) {
        const i = p.indexOf(c);
        if (i !== -1) { idx = i; p = p.slice(i); break; }
      }
      if (idx === -1) {
        // fallback: remove drive letters like C:/ if present
        p = p.replace(/^[A-Za-z]:\//, '');
      }
      if (!p.startsWith('/')) p = '/' + p;
      const parts = p.split('/');
      parts[parts.length - 1] = encodeURIComponent(parts[parts.length - 1]);
      return parts.join('/');
    }

    function fixText(text) {
      if (!/[ÃÂ]/.test(text)) return text;
      try {
        const bytes = new Uint8Array([...text].map((char) => char.charCodeAt(0) & 255));
        const decoded = new TextDecoder("utf-8", { fatal: false }).decode(bytes);
        return decoded && decoded.length >= text.length * 0.5 ? decoded : text;
      } catch {
        return text;
      }
    }

    function highlight(text, query) {
      const safeText = escapeHtml(text);
      if (!query) return safeText;
      const escapedQuery = escapeRegExp(escapeHtml(query));
      return safeText.replace(new RegExp(`(${escapedQuery})`, "gi"), "<mark>$1</mark>");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeRegExp(value) {
      return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }
  </script>
</body>
